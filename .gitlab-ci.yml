# Pipeline SonNuage bureau
#  - build   : tests (tests/), et les paquets de chaque système en parallèle (build/package.sh), dans les artefacts
#              win-x64 : installeur NSIS et .exe autonome · osx-arm64, osx-x64 : .dmg et SonNuage.app (zip)
#              linux-x64 : .deb et archive
#  - release : sur main, semantic-release choisit la version et crée le tag vX.Y.Z et sa release. Le pipeline du
#              tag y joint les paquets (registre de paquets génériques) et leur SHA256SUMS
#
# Signature : seulement si les variables existent (Settings → CI/CD → Variables, protégées, sur les tags v*), sinon
# paquets non signés. Windows : WINDOWS_CERT_PFX (type File), WINDOWS_CERT_PASSWORD (masquée). macOS :
# MACOS_CERT_P12 (File), MACOS_CERT_PASSWORD (masquée), APPLE_API_KEY_JSON (File, pour la notarisation).
# Voir build/windows/sign.sh et build/macos/sign.sh.
#
# SonNuage.UI vient du registre NuGet du projet sonnuage/sonnuage : ce projet doit être autorisé dans
# sonnuage → Settings → CI/CD → Job token permissions (liste des projets autorisés).
#
# Rapidité : paquets NuGet dans /nuget, un dossier de la machine monté par le runner (ni zip ni téléversement),
# images publiques téléchargées une seule fois (pull_policy if-not-present du runner).

stages: [build, release]

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: /nuget
  # Verrous NuGet dans le dossier partagé : sinon deux jobs en parallèle extraient le même paquet en même temps.
  NUGET_SCRATCH: /nuget/.scratch
  GIT_DEPTH: "10"
  FF_USE_FASTZIP: "true"
  ARTIFACT_COMPRESSION_LEVEL: fastest
  # Dernière release de ce projet : l'appli y cherche ses mises à jour (projet public, ou au moins ses releases et
  # son registre de paquets). Les builds 0.1.0-ci.N ne se mettent jamais à jour.
  UPDATE_FEED: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/permalink/latest"

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

default:
  interruptible: true

.nuget-auth: &nuget-auth
  - dotnet nuget update source sonnuage --username gitlab-ci-token --password "$CI_JOB_TOKEN" --store-password-in-clear-text --configfile nuget.config

test:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  script:
    - *nuget-auth
    - dotnet test --report-trx --results-directory "$CI_PROJECT_DIR/TestResults"
  artifacts:
    when: always
    paths: [TestResults/]
    expire_in: 7 days

.version: &version
  - |
    if [ -n "$CI_COMMIT_TAG" ]; then export VERSION="${CI_COMMIT_TAG#v}"; else export VERSION="0.1.0-ci.${CI_PIPELINE_IID}"; fi
    echo "Version $VERSION"

desktop:
  stage: build
  image: mcr.microsoft.com/dotnet/sdk:10.0
  parallel:
    matrix:
      - RID: [win-x64, linux-x64, osx-arm64, osx-x64]
  script:
    - *version
    - |
      case "$RID" in
        win-*) TOOLS="zip nsis osslsigncode" ;;
        osx-*) TOOLS="zip xorriso curl ca-certificates" ;;
        *) TOOLS="zip" ;;
      esac
      apt-get update -qq && apt-get install -y -qq --no-install-recommends $TOOLS > /dev/null
    - *nuget-auth
    - build/package.sh "$RID" "$VERSION" "$CI_PROJECT_DIR/dist"
  artifacts:
    name: "sonnuage-desktop-$RID"
    paths: [dist/]
    expire_in: 30 days

# Version suivante d'après les messages de commit (Conventional Commits : feat → mineure, fix → correctif,
# « ! » ou BREAKING CHANGE → majeure), tag vX.Y.Z et release GitLab avec ses notes. Le tag relance un pipeline
# qui publie la version. GITLAB_TOKEN : jeton du groupe sonnuage (variable masquée et protégée).
semantic-release:
  stage: release
  image: node:22-alpine
  needs: [test, desktop]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  variables:
    # Tout l'historique et les tags : la version se déduit des commits depuis le dernier tag.
    GIT_DEPTH: "0"
  script:
    - apk add --no-cache git > /dev/null
    - npx --yes -p semantic-release@25.0.9 -p @semantic-release/gitlab@13.3.3 -p conventional-changelog-conventionalcommits@9.3.1 semantic-release

# Sur tag (créé par semantic-release, avec sa release) : fichiers dans le registre de paquets génériques et liens
# dans la release. Les tags v* sont protégés : GITLAB_TOKEN y est disponible.
release-assets:
  stage: release
  image: alpine:3.22
  needs: [desktop]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  script:
    - apk add --no-cache curl > /dev/null
    - VERSION="${CI_COMMIT_TAG#v}"
    # Sommes de contrôle : l'appli vérifie le fichier téléchargé avant de l'installer.
    - (cd dist && sha256sum * > SHA256SUMS)
    - |
      for f in dist/*; do
        name=$(basename "$f")
        url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/sonnuage-desktop/${VERSION}/${name}"
        curl --fail -sS --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" "$url" > /dev/null
        curl --fail -sS --header "PRIVATE-TOKEN: $GITLAB_TOKEN" --data-urlencode "name=$name" --data-urlencode "url=$url"           --data "link_type=package" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links" > /dev/null
        echo "$name"
      done
